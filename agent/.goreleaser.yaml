# GoReleaser config for opalnavdeck-agent.
# Build: goreleaser release --snapshot --clean
version: 2

project_name: opalnavdeck-agent

builds:
  - id: agentd
    main: ./cmd/agentd
    binary: agentd
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: agentd
    ids: [agentd]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
